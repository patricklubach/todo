<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>ToDo</title>

        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    </head>

    <body>
        <div id="topbar">
            <div id="topbar-container-wrapper">
                <div id="sidebar-btn-container" class="topbar-container">
                    <button id="sidebar-btn" class="topbar-item" type="button" onclick="togglesidebar()">
                        ☰
                    </button>
                </div>
                <div id="search-container" class="topbar-container">
                    <input type="text" id="search" class="topbar-item" placeholder="Search... ( ⌘K / Ctrl+K )">
                </div>
                <div id="create-btn-container" class="topbar-container">
                    <button id="create-task-btn" class="topbar-item" type="button" onclick="Tasks.add()">+</button>
                </div>
            </div>
        </div>

        <div class="wrapper">
            <aside id="sidebar" class="sidebar">
                <div id="create-tasklist-container" class="topbar-container">
                    <button id="create-tasklist-btn" class="topbar-item" type="button" onclick="Tasks.add()">+</button>
                </div>
                <nav>
                    <ul>
                        <li>Dashboard</li>
                        <li>Tasks</li>
                        <li>Settings</li>
                    </ul>
                </nav>
            </aside>

            <main id="main-content">
                <div id="content-container">
                    <div id="add-task" class="task">
                        <label for="add-todo">Enter your task:</label>
                        <div class="editor">
                            <div id="description" contenteditable="true"></div>
                        </div>
                        <button class="add-button done-button" type="button" onclick="Tasks.add()">
                            Add
                        </button>
                    </div>
                    <div id="tasks"></div>
                </div>
            </main>
        </div>
    </body>

    <script src="handle.js"></script>
    <script src="eventhandler.js"></script>

</html>
