<!doctype html>
<html lang="en">
    <head>
        <title>ToDo</title>

        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    </head>

    <body>
        <div class="topnav">
            <input type="text" id="search" placeholder="Search.. (⌘K / Ctrl+K)">
        </div>
        <div id="wrapper">
            <div class="task" id="add-task">
                <label for="add-todo">Enter your task:</label>
                <div class="editor">
                    <div id="description" contenteditable="true"></div>
                </div>
                <button class="add-button done-button" onclick="Tasks.add()">
                    Add
                </button>
            </div>
            <div id="tasks"></div>
            <div id="error" style="display: none; color: red"></div>
        </div>
    </body>

    <script src="handle.js"></script>
    <script src="eventhandler.js"></script>

</html>
